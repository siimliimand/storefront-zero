# Local CI: MySQL + WordPress + WooCommerce + Playwright
# Usage:
#   ./scripts/ci-local.sh          # provision + run all tests
#   docker compose up -d wp        # just start WordPress
#   docker compose run --rm php-checks   # just run PHPStan + Pest
#   docker compose down -v         # tear down
name: sfz-ci

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/mysql

  wp:
    image: wordpress:6.7-php8.3-apache
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress
    ports:
      - "8080:80"
    volumes:
      - wp_data:/var/www/html
      - ./:/var/www/html/wp-content/themes/storefront-zero
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15

  provision:
    image: wordpress:cli-php8.3
    user: root
    depends_on:
      wp:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./:/var/www/html/wp-content/themes/storefront-zero
      - ./scripts/provision.sh:/usr/local/bin/provision.sh
    entrypoint: ["sh", "/usr/local/bin/provision.sh"]

  php-checks:
    image: php:8.3-cli
    working_dir: /app
    environment:
      PHP_MEMORY_LIMIT: 512M
    volumes:
      - ./:/app
    command: >
      sh -c "
        apt-get update -qq && apt-get install -y -qq unzip libzip-dev git > /dev/null 2>&1 &&
        docker-php-ext-install zip > /dev/null 2>&1 &&
        curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer > /dev/null 2>&1 &&
        composer install --no-interaction --no-progress --prefer-dist &&
        php -d memory_limit=1G vendor/bin/phpstan analyse --no-progress --memory-limit=1G &&
        vendor/bin/pest --no-coverage
      "

  test:
    image: mcr.microsoft.com/playwright:v1.48.0-noble
    depends_on:
      wp:
        condition: service_healthy
    working_dir: /tests
    volumes:
      - ./:/tests
      - /tests/node_modules
    environment:
      CI_BASE_URL: "http://wp:80"
    command: >
      sh -c "
        npm ci &&
        npx playwright install chromium &&
        npx playwright test
      "

volumes:
  wp_data:
